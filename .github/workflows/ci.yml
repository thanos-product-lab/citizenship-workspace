name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm -r --if-present test

  backend:
    name: Backend lint + typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: citizenship
          POSTGRES_PASSWORD: citizenship
          POSTGRES_DB: citizenship
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citizenship"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://citizenship:citizenship@localhost:5432/citizenship
      REDIS_URL: redis://localhost:6379/0
      STORAGE_ENDPOINT_URL: http://localhost:9000
      STORAGE_BUCKET: citizenship-evidence-ci
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      CW_EXPECT_MINIO: "1"
      # Pinned rather than `latest`: an image tag that moves is an image tag that can
      # vanish, which is exactly how this job first broke.
      MINIO_VERSION: RELEASE.2025-09-07T16-13-09Z
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version-file: services/platform/.python-version
      - run: uv sync
      # MinIO is a step, not a service container. The official image needs `server /data`
      # as a command, and a `services:` block cannot supply one — which is why the first
      # attempt reached for `bitnami/minio`, whose repository now has zero tags (Bitnami
      # moved everything to `bitnamilegacy/` in 2025). Starting it here keeps the
      # official image, a pinned tag, and a readiness check we control.
      #
      # The storage security tests are the only place that can assert a bucket is
      # private, that a URL expires, or that a deleted object is gone — the in-process
      # fake cannot. `CW_EXPECT_MINIO` below makes their absence a failure, not a skip,
      # so this step failing is meant to take the build down with it.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:${{ env.MINIO_VERSION }} server /data
          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:9000/minio/health/live; then
              echo "MinIO ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready; storage security assertions would not run"
          docker logs minio
          exit 1
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  contract:
    name: OpenAPI client drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version-file: services/platform/.python-version
      - name: Sync backend deps
        working-directory: services/platform
        run: uv sync
      - name: Regenerate the client from the live schema
        run: |
          mkdir -p packages/api-client/generated
          (cd services/platform && uv run python -m scripts.export_openapi) > packages/api-client/generated/openapi.json
          pnpm exec openapi-typescript packages/api-client/generated/openapi.json -o packages/api-client/generated/schema.d.ts
      - name: Fail if the committed client is out of date
        run: git diff --exit-code -- packages/api-client/generated
