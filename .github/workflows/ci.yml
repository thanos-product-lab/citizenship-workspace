name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck

  backend:
    name: Backend lint + typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: citizenship
          POSTGRES_PASSWORD: citizenship
          POSTGRES_DB: citizenship
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citizenship"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://citizenship:citizenship@localhost:5432/citizenship
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: services/platform/.python-version
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  contract:
    name: OpenAPI client drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: services/platform/.python-version
      - name: Sync backend deps
        working-directory: services/platform
        run: uv sync
      - name: Regenerate the client from the live schema
        run: |
          mkdir -p packages/api-client/generated
          (cd services/platform && uv run python -m scripts.export_openapi) > packages/api-client/generated/openapi.json
          pnpm exec openapi-typescript packages/api-client/generated/openapi.json -o packages/api-client/generated/schema.d.ts
      - name: Fail if the committed client is out of date
        run: git diff --exit-code -- packages/api-client/generated
