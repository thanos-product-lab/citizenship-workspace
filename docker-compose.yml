name: citizenship-workspace

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: citizenship
      POSTGRES_PASSWORD: citizenship
      POSTGRES_DB: citizenship
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citizenship"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Pinned to the same release CI runs. `latest` on both sides looks like agreement and
    # is not: the two resolve whenever each last pulled, so a storage behaviour can differ
    # between a green local run and a red CI one with nothing in the diff to explain it.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/platform.Dockerfile
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+psycopg://citizenship:citizenship@postgres:5432/citizenship
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: http://minio:9000
      # The address the browser reaches MinIO at. The API uses `minio:9000` over the
      # docker network; that hostname does not resolve on the host, so a URL signed
      # against it names somewhere the browser cannot go. Only the API signs URLs for
      # a browser, so only the API needs this.
      STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:9000
      STORAGE_BUCKET: citizenship-evidence
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/platform.Dockerfile
    # `--beat` runs the scheduler inside the worker rather than as a second service.
    #
    # The separate `beat` container this replaces was justified by a hazard that does
    # not exist: "two schedulers means every tick fires twice, and the relay would
    # dispatch each outbox row to two tasks". The first half is true and harmless; the
    # second is false. `claim_unpublished` takes its batch `FOR UPDATE SKIP LOCKED`, so
    # two concurrent relays claim *different* rows and no row is dispatched twice. The
    # cost of an extra tick is an extra empty query.
    #
    # The real constraint is narrower and worth stating: **do not scale this service
    # past one replica while `--beat` is on.** Not because dispatch would double, but
    # because every replica would carry its own scheduler, and a deployment that wants
    # more than one worker should split beat back out rather than multiply it.
    #
    # Local now matches the deployed shape, which is the other half of the point. The
    # scheduler was missing from Railway entirely, so on the deployed environment the
    # relay never ran: uploads sat in UPLOADED forever and deleted documents were never
    # purged, both silently. Two services locally and one deployed is exactly how that
    # goes unnoticed.
    command: uv run celery -A worker.celery_app.celery_app worker --beat --loglevel info
    # A hard ceiling under Celery's own child-recycling limit, so a document that
    # allocates faster than the recycler can react takes the container down rather than
    # the host. PyMuPDF is a C parser on attacker-controlled input and malware scanning
    # is a documented non-goal; bounding the blast radius is the control we do have.
    mem_limit: 1g
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+psycopg://citizenship:citizenship@postgres:5432/citizenship
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_BUCKET: citizenship-evidence
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
