name: citizenship-workspace

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: citizenship
      POSTGRES_PASSWORD: citizenship
      POSTGRES_DB: citizenship
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citizenship"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Pinned to the same release CI runs. `latest` on both sides looks like agreement and
    # is not: the two resolve whenever each last pulled, so a storage behaviour can differ
    # between a green local run and a red CI one with nothing in the diff to explain it.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/platform.Dockerfile
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+psycopg://citizenship:citizenship@postgres:5432/citizenship
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_BUCKET: citizenship-evidence
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/platform.Dockerfile
    command: uv run celery -A worker.celery_app.celery_app worker --loglevel info
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+psycopg://citizenship:citizenship@postgres:5432/citizenship
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_BUCKET: citizenship-evidence
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Celery beat, which runs the outbox relay. A separate service from the worker because
  # beat must be a *single* process: two schedulers means every tick fires twice, and the
  # relay would dispatch each outbox row to two tasks. Idempotency makes that survivable
  # rather than correct, and there is no reason to lean on it.
  beat:
    build:
      context: .
      dockerfile: infra/docker/platform.Dockerfile
    command: uv run celery -A worker.celery_app.celery_app beat --loglevel info
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+psycopg://citizenship:citizenship@postgres:5432/citizenship
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
