[project]
name = "citizenship-platform"
version = "0.1.0"
description = "Evidence-First Citizenship Workspace — FastAPI modular monolith."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "pytest>=8.3.4",
    "hypothesis>=6.123.0",
]

[tool.uv]
# Application, not a distributable package — no build backend required.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "property: Hypothesis property-based tests for the deterministic rules.",
]
