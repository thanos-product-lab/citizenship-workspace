[project]
name = "citizenship-platform"
version = "0.1.0"
description = "Evidence-First Citizenship Workspace — FastAPI modular monolith."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "pytest>=8.3.4",
    "hypothesis>=6.123.0",
    "httpx>=0.28.0",
]

[tool.uv]
# Application, not a distributable package — no build backend required.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "worker", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "worker", "tests"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Celery ships incomplete type information.
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's task decorators are untyped; allow them in task modules only.
module = ["worker.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "property: Hypothesis property-based tests for the deterministic rules.",
    "integration: needs external infra (Postgres, Redis); provided by `just up` or CI services.",
]
