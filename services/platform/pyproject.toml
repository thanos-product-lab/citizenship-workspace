[project]
name = "citizenship-platform"
version = "0.1.0"
description = "Evidence-First Citizenship Workspace — FastAPI modular monolith."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "pyjwt[crypto]>=2.10.0",
    # Private object storage (MinIO locally, S3-compatible in deployment).
    "boto3>=1.35.0",
    # Native PDF text and page metadata. Deterministic extraction only — no model
    # call anywhere in M7 (CLAUDE.md §3, Technical Architecture RFC §18).
    "pymupdf>=1.24.0",
    "certifi>=2024.8.30",
]

[dependency-groups]
dev = [
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "pytest>=8.3.4",
    "hypothesis>=6.123.0",
    "httpx>=0.28.0",
    # mypy runs strict over app/ and worker/; boto3 ships no inline types.
    "boto3-stubs[s3]>=1.35.0",
]

[tool.uv]
# Application, not a distributable package — no build backend required.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "worker", "tests"]
# Migrations are formatted by hand when written and never touched again. Excluded from
# the formatter because a repo-wide `ruff format` reflowed a *shipped* one (0004) and
# swept it into an unrelated commit. The change was semantically nothing, which is the
# problem: the rule "never edit a shipped migration" is only useful while every hit on
# one is a real signal, and formatting churn teaches a reviewer to skim past it.
# `ruff check` still lints them.
format.exclude = ["migrations/versions/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "worker", "tests"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Celery ships incomplete type information.
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF ships type stubs whose methods are largely untyped, so strict mode rejects
# every call into it. Scoped to the one module that touches the parser, so the rest of
# `app/` keeps the full strictness — and that module is deliberately small.
module = ["app.evidence.extraction", "tests.evidence.test_extraction", "scripts.make_fixtures"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Celery's task decorators are untyped; allow them in task modules only.
module = ["worker.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "property: Hypothesis property-based tests for the deterministic rules.",
    "integration: needs external infra (Postgres, Redis); provided by `just up` or CI services.",
  "minio: needs a live MinIO. The only tests permitted to assert a storage *security* property (private bucket, URL expiry, deleted object gone) — the in-process fake cannot. Guarded by test_storage_integration_tests_actually_ran, so a skip is a failure where CW_EXPECT_MINIO is set.",
]
